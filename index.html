<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVATHREADS Hub</title>
    <style>
        :root {
            --primary: #2d3748;
            --accent: #4c51bf;
            --danger: #e53e3e;
            --success: #38a169;
            --bg: #f7fafc;
            --muted: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--primary);
        }

        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 30px;
            background: linear-gradient(135deg, #ffffff 0%, #eef2ff 50%, #e2e8f0 100%);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .site-logo-wrapper {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            overflow: hidden;
            background: white;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }

        .site-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 { margin: 0; font-size: 32px; letter-spacing: 0.04em; }

        .insta-handle {
            font-size: 14px;
            color: var(--muted);
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: block;
            gap: 30px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }

        .product-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #edf2f7;
        }

        .product-img-placeholder {
            width: 100%;
            height: 220px;
            background-color: #edf2f7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0aec0;
            font-weight: bold;
        }

        .product-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title { font-size: 18px; font-weight: bold; margin: 0 0 6px 0; }
        .product-meta { font-size: 13px; color: #718096; margin-bottom: 8px; }
        .product-price { font-size: 20px; font-weight: bold; color: var(--accent); margin-bottom: 12px; }
        
        .stock-indicator {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 15px;
            padding: 4px 8px;
            border-radius: 4px;
            width: fit-content;
        }
        .in-stock { background: #c6f6d5; color: #22543d; }
        .out-of-stock { background: #fed7d7; color: #742a2a; }

    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="site-logo-wrapper">
                <img src="logo.png" alt="NAVATHREADS logo" class="site-logo">
            </div>
            <div>
                <h1>NAVATHREADS Hub</h1>
                <a href="https://instagram.com/navathreads" target="_blank" rel="noopener noreferrer" class="insta-handle">@navathreads</a>
            </div>
        </div>
        <div style="display:flex; gap:20px; align-items:center;">
            <div id="status-bubble" style="color: var(--success); font-weight: bold;">● Live Server Sync Connected</div>
            <div><a href="/admin">Admin Login</a></div>
        </div>
    </header>

    <div class="container">
        <div style="display:flex; justify-content:space-between; align-items:center; max-width:1200px; margin:0 auto 20px;">
            <h2>Active Marketplace Listings</h2>
        </div>
        <div style="max-width:1200px; margin:0 auto;">
            <div class="products-grid" id="products-container"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:3000';
        const container = document.getElementById('products-container');

        // Load inventory on startup
        loadInventory();

        function loadInventory() {
            fetch(`${API_BASE}/api/products`)
                .then(res => res.json())
                .then(products => {
                    container.innerHTML = '';
                    if(products.length === 0) {
                        container.innerHTML = '<p style="color:#718096">No inventory items found.</p>';
                        return;
                    }
                    products.forEach(p => {
                        const isStock = p.stockCount > 0;
                        const hasImg = p.images && p.images.length > 0;
                        const imgSrc = hasImg ? (p.images[0].startsWith('http') ? p.images[0] : `${API_BASE}${p.images[0]}`) : '';
                        const imgElem = hasImg 
                            ? `<img src="${imgSrc}" class="product-img" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=product-img-placeholder>📦 Image Needed</div>';">` 
                            : `<div class="product-img-placeholder">📦 Image Needed</div>`;
                        
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            ${imgElem}
                            <div class="product-info">
                                <div class="product-title">${p.name}</div>
                                <div class="product-meta">Category: ${p.category}</div>
                                <div class="product-price">₹${p.price}</div>
                                <div class="stock-indicator ${isStock ? 'in-stock' : 'out-of-stock'}">
                                    ${isStock ? `In Stock (${p.stockCount})` : 'Out of Stock'}
                                </div>
                                <div style="margin-top:auto;">
                                    <a href="/product.html?id=${p.id}"><button class="secondary">View</button></a>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                    document.getElementById('status-bubble').style.color = 'var(--success)';
                    document.getElementById('status-bubble').innerText = '● Live Server Sync Connected';
                })
                .catch(() => {
                    document.getElementById('status-bubble').style.color = 'var(--danger)';
                    document.getElementById('status-bubble').innerText = '● Connection Offline';
                });
        }
    </script>
</body>
</html>
